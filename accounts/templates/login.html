<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
     
    body {
        background: #f4f6f9;
        font-family: Arial, sans-serif;
    }

    .login-box {
        width: 350px;
        margin: 100px auto;
        padding: 30px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    input {
        width: 100%;               /* ✅ FULL WIDTH */
        padding: 12px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
        box-sizing: border-box;   /* IMPORTANT */
    }

    button {
        width: 100%;               /* SAME WIDTH */
        padding: 12px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #0056b3;
    }

    .error {
        color: red;
        text-align: center;
        margin-top: 10px;
    }


   
   
    </style>
</head>

<body>

<div class="login-box">
    <h2>Login</h2>

    <form method="post">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    {% for message in messages %}
        <p class="error">{{ message }}</p>
    {% endfor %}
</div>

</body>
</html>
